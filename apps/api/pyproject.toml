[project]
name = "polymech-api"
version = "0.1.0"
description = "FastAPI application orchestrating PolyMech Studio."
requires-python = ">=3.12"
dependencies = ["polymech-mechanics", "polymech-dataio", "polymech-plotting", "polymech-database", "polymech-ai", "fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_api"]
