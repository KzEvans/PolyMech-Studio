[project]
name = "polymech-dataio"
version = "0.1.0"
description = "Instrument file import, column mapping, unit normalisation and quality checks."
requires-python = ">=3.12"
dependencies = ["polymech-mechanics", "pandas>=2.2", "openpyxl>=3.1", "xlrd>=2.0", "pyarrow>=18", "charset-normalizer>=3.4", "scipy>=1.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_dataio"]
