[project]
name = "polymech-database"
version = "0.1.0"
description = "SQLite models, migrations, repositories and curve/raw-file storage."
requires-python = ">=3.12"
dependencies = ["polymech-mechanics", "sqlalchemy>=2.0", "alembic>=1.14", "pydantic>=2.10", "pandas>=2.2", "pyarrow>=18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_database"]
