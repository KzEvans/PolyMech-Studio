[project]
name = "polymech-plotting"
version = "0.1.0"
description = "Serializable PlotSpec, template registry and static figure export."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "matplotlib>=3.10", "numpy>=2.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_plotting"]
