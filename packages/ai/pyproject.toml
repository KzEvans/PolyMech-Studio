[project]
name = "polymech-ai"
version = "0.1.0"
description = "LLM provider adapters with schema-validated structured output."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "anthropic>=1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_ai"]
