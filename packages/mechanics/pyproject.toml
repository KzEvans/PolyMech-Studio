[project]
name = "polymech-mechanics"
version = "0.1.0"
description = "Deterministic polymer mechanics calculations (no IO, DB, AI or Origin dependencies)."
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15", "pint>=0.24"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymech_mechanics"]
